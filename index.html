ores"><div style="font-size:28px;margin-bottom:8px">🔎</div>Aucun élève trouvé</div>';return;}if(m.length===1){showEleve(m[0]);return;}const el=document.getElementById('sugg');el.style.display='block';el.innerHTML='<div class="sugg-box"><div class="sugg-title">'+m.length+' résultats</div>'+m.map(k=>'<div class="sugg-item" onclick="showEleve(\'' + k.replace(/\x27/g,"\\\x27") + '\')"><div class="sugg-name">'+DATA[k].nom_complet+'</div><div class="sugg-sub">'+DATA[k].classe+' — '+DATA[k].etablissement+'</div></div>').join('')+'</div>';}function nc(t){t=t.toLowerCase();if(t.includes('aesh'))return'na';if(t.includes('ordi'))return'no';if(t.includes('ulis'))return'nu';if(t.includes('sessad')||t.includes('itep'))return'ns';if(t.includes('ime')||t.includes('rqth'))return'nim';if(t.includes('segpa'))return'nsg';return'na';}function ni(t){t=t.toLowerCase();if(t.includes('aesh'))return'👤';if(t.includes('ordi'))return'💻';if(t.includes('ulis'))return'🏫';if(t.includes('sessad')||t.includes('itep'))return'🏥';if(t.includes('ime')||t.includes('rqth'))return'📋';if(t.includes('segpa'))return'🎓';return'📄';}function sc(s){if(!s)return'bw';if(s.includes('🟢'))return'bg';if(s.includes('🟡'))return'by';if(s.includes('🔴'))return'br';return'bw';}function showEleve(key){document.getElementById('sugg').style.display='none';const d=DATA[key];const notifs=(d.notifications||[]).filter(n=>n.valeur&&n.valeur.trim());const nH=notifs.length?'<div class="card"><div class="ctitle">Notifications MDPH / CDAPH</div><div class="nlist">'+notifs.map(n=>'<div class="ni '+nc(n.type)+'"><div class="nhead"><span>'+ni(n.type)+'</span><span class="ntype">'+n.type+'</span>'+(n.valeur?'<span class="nval">'+n.valeur+'</span>':'')+'</div>'+(n.date_fin?'<div class="nfin">📅 Échéance : '+n.date_fin+'</div>':'')+(n.date_debut?'<div class="ndates">Début : '+n.date_debut+'</div>':'')+'</div>').join('')+'</div></div>':'';const p1=d.parent1||{},p2=d.parent2||{};function pb(p,l){if(!p.nom)return'';return '<div class="cb"><div class="clabel">'+l+'</div><div class="cname">'+p.nom+'</div>'+(p.adresse?'<div class="cline">📍 <span>'+p.adresse+'</span></div>':'')+(p.tel?'<div class="cline">📞 <a href="tel:'+p.tel.replace(/ /g,'')+'">'+p.tel+'</a></div>':'')+(p.email?'<div class="cline">✉️ <a href="mailto:'+p.email+'" class="em">'+p.email+'</a></div>':'')+'</div>';}const cH=(p1.nom||p2.nom)?'<div class="card"><div class="ctitle">Coordonnées Famille</div><div class="cgrid">'+pb(p1,'Parent 1')+pb(p2,'Parent 2')+'</div></div>':'';document.getElementById('app').innerHTML='<div class="cards">'+'<div class="card"><div class="idh"><div><div class="idn">'+d.nom_complet+'</div>'+(d.date_naissance?'<div class="idd">Né(e) le '+d.date_naissance+'</div>':'')+'</div><button class="rbtn" onclick="reset()">✕</button></div><div class="tags">'+(d.classe?'<span class="tag tb">'+d.classe+'</span>':'')+(d.etablissement?' <span class="tag ts">'+d.etablissement+'</span>':'')+(d.commune?' <span class="tag tl">📍 '+d.commune+'</span>':'')+'</div></div>'+'<div class="card"><div class="ctitle">Équipe de Suivi de Scolarisation</div><div class="esrow">'+(d.es_date?'<div><div class="esdl">Date de réunion</div><div class="esdv">'+d.es_date+'</div></div>':'')+(d.es_statut?'<span class="badge '+sc(d.es_statut)+'">'+d.es_statut+'</span>':'')+'</div>'+(d.pps?'<div class="pps">📄 PPS : '+d.pps+'</div>':'')+(d.mention?'<div class="mention">⏳ '+d.mention+'</div>':'')+'</div>'+nH+cH+'</div>';}function reset(){document.getElementById('app').innerHTML='';document.getElementById('q').value='';document.getElementById('sugg').style.display='none';document.getElementById('q').focus();}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Escape')reset();});</script></body></html>
