function start(d){ DATA = d; LIST = Object.values(d); $('hint').textContent = LIST.length + ' élèves chargés'; }

/* ── Version en ligne : données chiffrées (AES-GCM, clé dérivée du mot de passe) ── */
const PW_KEY = 'erseh_mdp';
async function decrypt(pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, key, b(ENC.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw, remember){
  try {
    const d = await decrypt(pw);
    try { if (remember) localStorage.setItem(PW_KEY, pw); else localStorage.removeItem(PW_KEY); } catch(e){}
    $('lock').style.display = 'none';
    start(d);
    return true;
  } catch(e) {
    try { localStorage.removeItem(PW_KEY); } catch(_){}
    return false;
  }
}
function initLock(){
  $('lock').style.display = 'flex';
  $('lockout').innerHTML = "<button class='lockout' id='forget'>Verrouiller</button>";
  $('forget').onclick = () => { try { localStorage.removeItem(PW_KEY); } catch(e){} location.reload(); };
  $('lockbtn').onclick = async () => {
    $('lockerr').textContent = '…';
    const ok = await unlock($('lockpw').value, $('lockrem').checked);
    $('lockerr').textContent = ok ? '' : 'Mot de passe incorrect';
  };
  $('lockpw').addEventListener('keydown', e => { if (e.key === 'Enter') $('lockbtn').click(); });
  let saved = null; try { saved = localStorage.getItem(PW_KEY); } catch(e){}
  if (saved) unlock(saved, true); else $('lockpw').focus();
}

function norm(s){ return (s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function matches(q){ return LIST.map((d,i)=>[d,i]).filter(([d]) => norm(d.nom_complet).includes(q) || norm(d.prenom+' '+d.nom).includes(q)); }

/* ── Copier dans le presse-papiers ── */
async function copyText(t){
  try { if (window.pywebview && window.pywebview.api && window.pywebview.api.copy) { await window.pywebview.api.copy(t); return true; } } catch(e){}
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
let toastTimer;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1600); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  e.preventDefault();
  const ok = await copyText(b.getAttribute('data-copy'));
  toast(ok ? '✓ Copié dans le presse-papiers' : '⚠️ Copie impossible');
  if (ok) { b.classList.add('ok'); setTimeout(()=>b.classList.remove('ok'), 1200); }
});
function cpy(text, label){ return text ? `<button class='cpy' data-copy="${esc(text)}" title='Copier'>${label||'📋'}</button>` : ''; }

/* ── Recherche ── */
function renderList(m, title){
  const el = $('sugg');
  el.style.display = 'block';
  el.innerHTML = `<div class='sugg-box'><div class='sugg-title'>${title}</div>` +
    m.map(([d,i]) => `<div class='sugg-item' data-i='${i}'><div class='sugg-name'>${esc(d.nom_complet)}</div><div class='sugg-sub'>${esc(d.classe)} — ${esc(d.etablissement)}</div></div>`).join('') + `</div>`;
}
function onInput(){
  const q = norm($('q').value);
  if (q.length < 2) { $('sugg').style.display = 'none'; $('app').innerHTML = ''; return; }
  const m = matches(q).slice(0, 10);
  if (!m.length) { $('sugg').style.display = 'none'; return; }
  renderList(m, m.length + ' résultat(s)');
}
function doSearch(){
  const q = norm($('q').value);
  if (!q) return;
  const m = matches(q);
  $('sugg').style.display = 'none';
  if (!m.length) { $('app').innerHTML = "<div class='nores'><div style='font-size:28px;margin-bottom:8px'>🔎</div>Aucun élève trouvé</div>"; return; }
  if (m.length === 1) { showEleve(m[0][1]); return; }
  renderList(m, m.length + ' résultats');
}
$('q').addEventListener('input', onInput);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); if (e.key === 'Escape') reset(); });
$('go').addEventListener('click', doSearch);
$('sugg').addEventListener('click', e => { const it = e.target.closest('.sugg-item'); if (it) showEleve(+it.dataset.i); });

/* ── Affichage fiche ── */
function nc(t){t=t.toLowerCase();if(t.includes('aesh'))return'na';if(t.includes('ordi'))return'no';if(t.includes('ulis'))return'nu';if(t.includes('sessad')||t.includes('itep'))return'ns';if(t.includes('ime')||t.includes('rqth'))return'nim';if(t.includes('segpa'))return'nsg';return'na';}
function ni(t){t=t.toLowerCase();if(t.includes('aesh'))return'👤';if(t.includes('ordi'))return'💻';if(t.includes('ulis'))return'🏫';if(t.includes('sessad')||t.includes('itep'))return'🏥';if(t.includes('ime')||t.includes('rqth'))return'📋';if(t.includes('segpa'))return'🎓';return'📄';}
function sc(s){if(!s)return'bw';if(s.includes('🟢'))return'bg';if(s.includes('🟡'))return'by';if(s.includes('🔴'))return'br';return'bw';}
function isPast(fr){ const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(fr||''); if(!m) return false; return new Date(+m[3], +m[2]-1, +m[1], 23, 59) < new Date(); }

function parentText(p){ return [p.nom, p.adresse, p.tel, p.email].filter(Boolean).join('\n'); }
function pb(p, label){
  if (!p.nom && !p.tel && !p.email) return '';
  const tel = p.tel ? p.tel.replace(/[^\d+]/g,'') : '';
  return `<div class='cb'>
    <div class='cbh'><div class='clabel'>${label}</div>${cpy(parentText(p), '📋 Tout copier')}</div>
    ${p.nom ? `<div class='cline'><span class='cname cval'>${esc(p.nom)}</span>${cpy(p.nom)}</div>` : ''}
    ${p.adresse ? `<div class='cline'>📍 <span class='cval'>${esc(p.adresse)}</span>${cpy(p.adresse)}</div>` : ''}
    ${p.tel ? `<div class='cline'>📞 <span class='cval'><a href='tel:${esc(tel)}'>${esc(p.tel)}</a></span>${cpy(p.tel)}</div>` : ''}
    ${p.email ? `<div class='cline'>✉️ <span class='cval'><a href='mailto:${esc(p.email)}' class='em'>${esc(p.email)}</a></span>${cpy(p.email)}</div>` : ''}
  </div>`;
}

function showEleve(i){
  $('sugg').style.display = 'none';
  const d = LIST[i];
  const notifs = (d.notifications||[]).filter(n => n.valeur && n.valeur.trim());
  const nH = notifs.length ? `<div class='card'><div class='ctitle'>Notifications MDPH / CDAPH</div><div class='nlist'>` +
    notifs.map(n => `<div class='ni ${nc(n.type)}'>
      <div class='nhead'><span>${ni(n.type)}</span><span class='ntype'>${esc(n.type)}</span><span class='nval'>${esc(n.valeur)}</span></div>
      ${n.date_fin ? `<div class='nfin ${isPast(n.date_fin)?'exp':''}'>📅 Échéance : ${esc(n.date_fin)}${isPast(n.date_fin)?' — échue':''}</div>` : ''}
      ${(n.date_debut||n.date_decision) ? `<div class='ndates'>${n.date_decision?'Décision CDAPH : '+esc(n.date_decision):''}${n.date_decision&&n.date_debut?' · ':''}${n.date_debut?'Début : '+esc(n.date_debut):''}</div>` : ''}
    </div>`).join('') + `</div></div>` : '';

  const p1 = d.parent1||{}, p2 = d.parent2||{};
  const emails = [p1.email, p2.email].filter(Boolean).join('; ');
  const all = [d.nom_complet, '', p1.nom||p1.tel||p1.email ? 'Parent 1\n'+parentText(p1) : '', p2.nom||p2.tel||p2.email ? 'Parent 2\n'+parentText(p2) : ''].filter((x,k)=>x||k===1).join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
  const pB = pb(p1,'Parent 1') + pb(p2,'Parent 2');
  const cH = pB ? `<div class='card'>
      <div class='ctitle-row'><div class='ctitle'>Coordonnées Famille</div>
        <div class='idbtns'>${cpy(emails, '✉️ Copier les emails')}${cpy(all, '📋 Tout copier')}</div></div>
      <div class='cgrid'>${pB}</div></div>` : '';

  const idText = [d.nom_complet, d.date_naissance && 'Né(e) le '+d.date_naissance, d.classe, d.etablissement, d.commune].filter(Boolean).join(' — ');
  const mentions = (d.mentions||[]).map(m => `<div class='mention'>⏳ ${esc(m)}</div>`).join('');

  $('app').innerHTML = `<div class='cards'>
    <div class='card'>
      <div class='idh'><div><div class='idn'>${esc(d.nom_complet)}</div>${d.date_naissance?`<div class='idd'>Né(e) le ${esc(d.date_naissance)}</div>`:''}</div>
        <div class='idbtns'>${cpy(idText)}<button class='rbtn' onclick='reset()'>✕</button></div></div>
      <div class='tags'>${d.classe?`<span class='tag tb'>${esc(d.classe)}</span>`:''}${d.etablissement?`<span class='tag ts'>${esc(d.etablissement)}</span>`:''}${d.commune?`<span class='tag tl'>📍 ${esc(d.commune)}</span>`:''}</div>
    </div>
    <div class='card'><div class='ctitle'>Équipe de Suivi de Scolarisation 2026-2027</div>
      <div class='esrow'>
        ${d.es_date?`<div><div class='esdl'>Date de réunion</div><div class='esdv'>${esc(d.es_date)}</div></div>`:`<div class='esdl'>Pas de date d'ESS saisie</div>`}
        ${d.es_statut?`<span class='badge ${sc(d.es_statut)}'>${esc(d.es_statut)}</span>`:''}
      </div>
      ${d.pps?`<div class='pps'>📄 PPS : ${esc(d.pps)}</div>`:''}
      ${mentions}
    </div>
    ${nH}${cH}
  </div>`;
}
function reset(){ $('app').innerHTML = ''; $('q').value = ''; $('sugg').style.display = 'none'; $('q').focus(); }
if (DATA) start(DATA); else if (ENC) initLock();
</script></body></html>
